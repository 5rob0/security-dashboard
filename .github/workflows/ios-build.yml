# .github/workflows/ios-build.yml
# ─────────────────────────────────────────────────────────────────────────────
# Build an unsigned .ipa using Xcode on GitHub's Mac runner.
# No Expo account, no Apple Developer account, no tokens needed.
# Download the IPA → drag into Sideloadly → install on iPhone.
#
# REQUIRED SECRETS: None!
# ─────────────────────────────────────────────────────────────────────────────

name: iOS IPA Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Print toolchain versions ──────────────────────────────────────
      - name: Print build environment
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "macOS: $(sw_vers -productVersion)"
          echo "Ruby:  $(ruby --version)"

      # ── 3. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 4. Install npm dependencies ──────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 5. Generate native iOS project from Expo ─────────────────────────
      #    expo prebuild generates the ios/ folder with Xcode project files.
      #    This is the "eject" step — turns your JS app into a native project.
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      # ── 6. Install CocoaPods dependencies ────────────────────────────────
      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      # ── 7. Build with Xcode (unsigned — Sideloadly will re-sign) ─────────
      - name: Build iOS app with Xcode
        working-directory: ios
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace SecurityDashboard.xcworkspace \
            -scheme SecurityDashboard \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath ./build \
            clean build \
            2>&1 | tee ../xcodebuild.log

          echo ""
          echo "✅ Xcode build finished"

      # ── 8. Package .app into .ipa ────────────────────────────────────────
      - name: Package IPA
        run: |
          set -euo pipefail

          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found!"
            find ios/build -type d -maxdepth 5
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SecurityDashboard.ipa Payload
          rm -rf Payload

          echo ""
          echo "✅ IPA created:"
          ls -lh SecurityDashboard.ipa

      # ── 9. Upload IPA as downloadable artifact ───────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SecurityDashboard
          path: SecurityDashboard.ipa
          retention-days: 30
          if-no-files-found: error

      # ── 10. Upload Xcode log on failure ──────────────────────────────────
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
