# .github/workflows/ios-build.yml
# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions: Build a downloadable .ipa using EAS cloud.
#
# HOW IT WORKS:
#   1. Triggers an iOS build on Expo's cloud servers (they handle certificates)
#   2. Waits for the build to finish
#   3. Downloads the .ipa from Expo
#   4. Uploads it as a GitHub Actions artifact — download from the Actions tab
#
# REQUIRED GITHUB SECRET (only one needed!):
#   EXPO_TOKEN → expo.dev → Account Settings → Access Tokens → Create
#
# FREE TIER:
#   Expo gives you 30 free iOS cloud builds per month.
#   No Apple Developer account required for internal/ad-hoc distribution.
#
# TRIGGER:
#   - Push to `main`, OR
#   - Manually: GitHub → Actions → "iOS IPA Build" → Run workflow
#
# DOWNLOAD YOUR IPA:
#   Actions → completed run → Artifacts → SecurityDashboard-iOS.ipa
# ─────────────────────────────────────────────────────────────────────────────

name: iOS IPA Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_profile:
        description: "EAS build profile (preview or production)"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: ubuntu-latest   # ← Linux is fine — the actual compile happens on Expo's Mac

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Install EAS CLI ────────────────────────────────────────────────
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      # ── 5. Verify EXPO_TOKEN is set ───────────────────────────────────────
      - name: Verify EXPO_TOKEN secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ EXPO_TOKEN secret is missing!"
            echo "   Go to: GitHub repo → Settings → Secrets → Actions → New secret"
            echo "   Name: EXPO_TOKEN"
            echo "   Value: get from expo.dev → Account Settings → Access Tokens"
            exit 1
          fi
          echo "✅ EXPO_TOKEN is set"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ── 6. Authenticate ───────────────────────────────────────────────────
      - name: Authenticate with Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas whoami
          echo "✅ Authenticated successfully"

      # ── 7. Submit cloud build and wait for it to finish ───────────────────
      #
      # --wait            → blocks this job until the EAS build is 100% done
      # --non-interactive → never pauses for prompts (required for CI)
      # No --local flag   → Expo's Mac servers handle Xcode + certificates
      #
      - name: Trigger EAS cloud build and wait
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_PROFILE="${{ github.event.inputs.build_profile || 'preview' }}"
          echo "🏗️  Starting EAS cloud build (profile: $BUILD_PROFILE)..."
          echo "    This will take ~10-20 minutes on Expo's servers."
          echo ""

          # Run build, capture output to extract the build URL
          eas build \
            --platform ios \
            --profile "$BUILD_PROFILE" \
            --non-interactive \
            --wait \
            --json \
            2>&1 | tee /tmp/eas-output.json

          echo "✅ EAS cloud build finished"

      # ── 8. Download the IPA from Expo ─────────────────────────────────────
      - name: Download IPA from Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p ./build

          echo "📥 Downloading IPA from Expo servers..."

          # Download the most recent successful iOS build
          eas build:download \
            --platform ios \
            --output ./build/SecurityDashboard.ipa \
            --non-interactive

          echo ""
          echo "✅ Download complete:"
          ls -lh ./build/

      # ── 9. Upload IPA as GitHub Actions artifact ──────────────────────────
      #
      # After this step completes, go to:
      # Actions → this run → scroll to bottom → Artifacts
      # Click "SecurityDashboard-iOS" to download your .ipa
      #
      - name: Upload IPA as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecurityDashboard-iOS
          path: ./build/SecurityDashboard.ipa
          retention-days: 30
          if-no-files-found: error

      # ── 10. Print install instructions ────────────────────────────────────
      - name: Print install instructions
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║           ✅ IPA BUILD COMPLETE                      ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  Download: Actions → this run → Artifacts            ║"
          echo "║                                                      ║"
          echo "║  Install options:                                    ║"
          echo "║  • AltStore (free, no Apple account needed)          ║"
          echo "║  • Sideloadly (free)                                 ║"
          echo "║  • TestFlight (needs Apple Developer $99/yr)         ║"
          echo "╚══════════════════════════════════════════════════════╝"
