# .github/workflows/ios-build.yml
# ─────────────────────────────────────────────────────────────────────────────
# Build an unsigned .ipa using Xcode on GitHub's Mac runner.
# No Expo account, no Apple Developer account, no tokens needed.
# Download the IPA → drag into Sideloadly → install on iPhone.
#
# REQUIRED SECRETS: None!
# ─────────────────────────────────────────────────────────────────────────────

name: iOS IPA Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Print toolchain versions ──────────────────────────────────────
      - name: Print build environment
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "macOS: $(sw_vers -productVersion)"
          echo "Ruby:  $(ruby --version)"

      # ── 3. Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 4. Install npm dependencies ──────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 5. Generate native iOS project from Expo ─────────────────────────
      #    expo prebuild generates the ios/ folder with Xcode project files.
      #    This is the "eject" step — turns your JS app into a native project.
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      # ── 6. Patch Podfile for compatibility ─────────────────────────────────
      #    expo prebuild generates a keyword the runner's CocoaPods doesn't know.
      - name: Patch generated Podfile
        working-directory: ios
        run: |
          echo "Before patch:"
          grep -n "privacy_file_aggregation_enabled" Podfile || echo "(keyword not found, no patch needed)"

          # Delete the entire line containing the keyword so we don't leave broken Ruby syntax behind
          sed -i '' '/privacy_file_aggregation_enabled/d' Podfile
          
          # Fix the Swift/Objective-C static library error by enabling modular headers globally
          echo "use_modular_headers!" > Podfile.new
          cat Podfile >> Podfile.new
          mv Podfile.new Podfile

          echo "After patch:"
          head -n 5 Podfile

      # ── 7. Install CocoaPods dependencies ────────────────────────────────
      - name: Install CocoaPods
        working-directory: ios
        run: |
          set -euo pipefail
          pod install

      # ── 8. Build with Xcode (unsigned — Sideloadly will re-sign) ─────────
      - name: Build iOS app with Xcode
        working-directory: ios
        run: |
          set -euo pipefail

          # Auto-detect workspace and scheme names
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 1 | head -1)
          echo "Found workspace: $WORKSPACE"

          if [ -z "$WORKSPACE" ]; then
            echo "❌ No .xcworkspace found! Contents of ios/:"
            ls -la
            exit 1
          fi

          # Scheme name = workspace name without extension
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Using scheme: $SCHEME"

          # List available schemes for debugging
          xcodebuild -workspace "$WORKSPACE" -list 2>/dev/null || true

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath ./build \
            clean build \
            2>&1 | tee ../xcodebuild.log

          echo ""
          echo "✅ Xcode build finished"

      # ── 8. Package .app into .ipa ────────────────────────────────────────
      - name: Package IPA
        run: |
          set -euo pipefail

          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app bundle found!"
            find ios/build -type d -maxdepth 5
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r SecurityDashboard.ipa Payload
          rm -rf Payload

          echo ""
          echo "✅ IPA created:"
          ls -lh SecurityDashboard.ipa

      # ── 9. Upload IPA as downloadable artifact ───────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SecurityDashboard
          path: SecurityDashboard.ipa
          retention-days: 30
          if-no-files-found: error

      # ── 10. Upload Xcode log on failure ──────────────────────────────────
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
